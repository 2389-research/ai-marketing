# fly.toml — Postique
# One image, four process groups: the web server, the Slack approval bot
# (persistent Socket Mode connection, no exposed port), cron (supercronic
# running deploy/crontab), and renderer (headless-Chrome video rendering).
# web/slackbot/cron share BACKEND_PATH/BACKEND_PYTHON so the frontend's
# "Run now" buttons (child_process.spawn against local .py files) work
# exactly as they do on your laptop.

app = "postique"          # must be globally unique — `fly apps create <name>` first if taken
primary_region = "ord"    # Chicago — closest Fly region to America/Chicago; change if you're elsewhere

[build]
  [build.args]
    NEXT_PUBLIC_SUPABASE_URL = "https://blxxqexmroymaejoivxa.supabase.co"       # safe to hardcode here — it's a public URL, not a secret
    NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_JValB_FieHWDxmALvNLVrg_FzY2UMR5"  # anon key is meant to be public; protected by Supabase RLS

[env]
  # Web forwards renders to the renderer group over the app's private flycast
  # address; the port matches the renderer [[services]] internal_port below.
  RENDERER_URL = "http://postique.flycast:3002"

[processes]
  web      = "node frontend/server.js"
  slackbot = "/app/.venv/bin/python /app/slack_app.py"
  cron     = "supercronic /app/deploy/crontab"
  renderer = "node frontend/render-server.mjs"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false   # keep the web machine running — cron/slackbot depend on this being always-on anyway
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

# Renderer service — internal only (reached via postique.flycast:3002).
# Scales to zero: Fly Proxy auto-starts the machine on an incoming render
# request and auto-stops it once idle, so the performance CPU is only billed
# during actual renders.
[[services]]
  internal_port = 3002
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["renderer"]

  # Flycast is HTTP-only, so the port must declare the http handler — without
  # it the proxy resets the connection instead of routing/autostarting. This
  # also makes port 3002 reachable on the app's public IPv6, so render-server
  # requires a shared-secret header (AUTH_TOKEN) that only the web tier sends.
  [[services.ports]]
    port = 3002
    handlers = ["http"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"   # web no longer renders video — that moved to the renderer group
  processes = ["web"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["slackbot"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"   # video_process.py / faster-whisper need headroom when "Run now" fires on this same image
  processes = ["cron"]

[[vm]]
  size = "performance-2x"   # 2 dedicated vCPUs / 4GB — headless-Chrome frame rendering; scale-to-zero so only billed while rendering
  memory = "4096mb"
  processes = ["renderer"]
