# ABOUTME: Dependabot config — weekly dependency updates for pip, npm, Docker, and Actions.
# ABOUTME: Grouped into few PRs so updates don't drown the review queue.
version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Remotion ships many packages that must move together — a partial bump
      # breaks rendering.
      remotion:
        patterns: ['remotion', '@remotion/*']
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
