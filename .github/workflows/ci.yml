# ABOUTME: CI for pull requests and pushes to main — Python tests and a frontend build.
# ABOUTME: Uses placeholder Supabase/Anthropic values; nothing here touches a real service.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python tests
    runs-on: ubuntu-latest
    env:
      # Several agent modules build a Supabase client at import time, so these
      # must be set for collection to succeed. The tests themselves are pure —
      # no network, no database. These are placeholders, not credentials.
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: placeholder-key-not-a-secret
      ANTHROPIC_API_KEY: placeholder-key-not-a-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # NEXT_PUBLIC_* is inlined at build time, so the build fails without these.
      # Placeholders — the built bundle is discarded, never deployed from here.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key-not-a-secret
      NEXT_PUBLIC_SCHEDULE_TIMEZONE: America/Chicago
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # next build runs the TypeScript compiler, so this covers typechecking too.
      - name: Build
        run: npm run build
